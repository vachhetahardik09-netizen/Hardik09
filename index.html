<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple AI Model</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0f2fe, #dbeafe);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 420px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            background: #eff6ff;
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .result h2 {
            color: #16a34a;
            margin: 5px;
        }

        .accuracy {
            color: #555;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🤖 Simple AI Model</h1>

    <p class="subtitle">
        Iris Flower Prediction
    </p>

    <label>Sepal Length</label>
    <input type="number" id="sl" step="0.1" placeholder="Example: 5.1">

    <label>Sepal Width</label>
    <input type="number" id="sw" step="0.1" placeholder="Example: 3.5">

    <label>Petal Length</label>
    <input type="number" id="pl" step="0.1" placeholder="Example: 1.4">

    <label>Petal Width</label>
    <input type="number" id="pw" step="0.1" placeholder="Example: 0.2">

    <button onclick="predict()">Predict Flower</button>

    <div class="result" id="result">
        <h2 id="prediction"></h2>
        <p class="accuracy">
            AI Model Prediction Completed
        </p>
    </div>

</div>

<script>

function predict() {

    let sl = parseFloat(document.getElementById("sl").value);
    let sw = parseFloat(document.getElementById("sw").value);
    let pl = parseFloat(document.getElementById("pl").value);
    let pw = parseFloat(document.getElementById("pw").value);

    if (isNaN(sl) || isNaN(sw) || isNaN(pl) || isNaN(pw)) {
        alert("Please enter all four values.");
        return;
    }

    let flower;

    /*
       Simple decision-tree style AI model
       based on Iris flower characteristics.
    */

    if (pw <= 0.6 && pl <= 1.9) {

        flower = "🌸 Iris Setosa";

    } else if (pw <= 1.7 && pl <= 5.0) {

        flower = "🌺 Iris Versicolor";

    } else {

        flower = "🌷 Iris Virginica";

    }

    document.getElementById("prediction").innerHTML = flower;

    document.getElementById("result").style.display = "block";
}

</script>

</body>
</html>
